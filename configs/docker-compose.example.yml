# Rebuild baseline. Run from repository root with --env-file .env.
# HTTP is intentional for the isolated historical lab; see SECURITY.md.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-9.2.0}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD in .env}
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms2g -Xmx2g}
    ports:
      - "${ES_BIND_ADDRESS:-192.168.64.1}:${ES_PORT:-9200}:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION:-9.2.0}
    environment:
      SERVER_HOST: 0.0.0.0
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:?Set KIBANA_SYSTEM_PASSWORD in .env}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTED_SAVED_OBJECTS_KEY:?Set a stable key of at least 32 characters}
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_SECURITY_ENCRYPTION_KEY:?Set a stable key of at least 32 characters}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_REPORTING_ENCRYPTION_KEY:?Set a stable key of at least 32 characters}
    ports:
      - "${KIBANA_BIND_ADDRESS:-127.0.0.1}:${KIBANA_PORT:-5601}:5601"
    depends_on:
      - elasticsearch
    restart: unless-stopped

  # Start only after Kibana creates a Fleet Server policy and service token.
  # Without explicit cert/key options Fleet Server generates a self-signed cert.
  fleet-server:
    profiles: ["fleet"]
    image: docker.elastic.co/elastic-agent/elastic-agent:${STACK_VERSION:-9.2.0}
    user: root
    environment:
      FLEET_SERVER_ENABLE: "1"
      FLEET_SERVER_ELASTICSEARCH_HOST: http://elasticsearch:9200
      FLEET_SERVER_SERVICE_TOKEN: ${FLEET_SERVER_SERVICE_TOKEN:-}
      FLEET_SERVER_POLICY_ID: ${FLEET_SERVER_POLICY_ID:-}
      FLEET_SERVER_HOST: 0.0.0.0
      FLEET_SERVER_PORT: "8220"
    ports:
      - "${FLEET_BIND_ADDRESS:-192.168.64.1}:${FLEET_PORT:-8220}:8220"
    volumes:
      - fleetstate:/usr/share/elastic-agent/state
    depends_on:
      - elasticsearch
    restart: unless-stopped

volumes:
  esdata:
  fleetstate:
